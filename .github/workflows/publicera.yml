# Publicerar Kvanto Mallverktyg på Cloudflare varje gång något läggs upp på
# main. Testerna måste gå igenom först.
#
# Kräver i repot (Settings → Secrets and variables → Actions):
#   Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (samma som för Kvanto)
# Saknas nyckeln hoppas publiceringen över; testerna körs ändå.
name: Publicera

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: publicera

jobs:
  publicera:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tester
        run: npm test
      - name: Bygg
        run: npm run build
      - name: Publicera på Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4.163.0 deploy
      - name: Ingen publicering
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN saknas i repots hemligheter, så tillägget publicerades inte."
